schema: spec-driven

context: |
  项目：MoviePilot Lite，基于 MoviePilot v2 的非官方私有精简构建。
  项目语言和文档语言为简体中文；代码命名遵循上游约定。
  开始任何变更前，必须阅读 AGENTS.md、PROJECT_BRIEF.md、
  docs/ARCHITECTURE.md、docs/COMPATIBILITY.md 和 docs/UPSTREAM_SYNC.md。
  产品范围、架构边界和兼容性结论以上述文档为准，不在单项变更中擅自扩大。

  核心目标是保留网盘、元数据识别、文件整理、插件、消息通知、
  媒体服务器和必要认证能力，并在构建及运行时真正移除非目标能力。
  115 是首个真实验收网盘；P115StrmHelper 由用户手动安装，
  Lite 未安装该插件时仍须正常启动，并明确提示相关功能不可用。
  消息渠道身份、白名单和命令权限行为与官方版本保持一致。

  Lite 必须通过统一 capability profile，在模块导入、API 注册、
  后台服务、定时任务、依赖安装和前端打包之前完成能力裁剪。
  禁止仅隐藏菜单；禁用能力不得被导入、注册、实例化、调度或打包。
  尽量保留上游目录结构和提交历史，以降低持续同步成本。

  正式运行环境为 Docker linux/amd64 和 linux/arm64，数据库为 SQLite，
  缓存为进程内缓存。保留 ffprobe，不保留 ffmpeg。
  必须保护 /config 的迁移和回退能力，禁止提交任何真实令牌、密码或 Cookie。
  普通 CI 使用模拟服务；真实 115 和外部服务验证只在隔离 Canary 环境执行。

rules:
  proposal:
    - 使用简体中文编写。
    - 每个变更只解决一个明确目标，并使用稳定的 kebab-case 变更 ID。
    - 说明变更原因、范围、非目标、受影响能力及与上游同步的影响。
    - 分别列出新增能力和需求发生变化的已有能力。
    - 评估后端、前端、插件、依赖、配置、数据库、Docker 和资源占用影响。
    - 说明安全、兼容性、迁移、回退和验证要求。
    - 不得把尚未批准的相关功能顺带纳入变更。

  specs:
    - 使用简体中文编写可验证的规范性需求。
    - 每项需求使用明确的 MUST 或 SHALL 语义。
    - 每项需求至少提供一个 Given、When、Then 验收场景。
    - 覆盖正常流程、禁用流程、缺失依赖、失败恢复和权限拒绝场景。
    - 对移除能力明确验证其未导入、未注册、未实例化、未调度且未打包。
    - 明确区分保持官方行为、Lite 特有行为和已知不兼容行为。
    - 不得在规范或示例中包含真实密码、Cookie、Token 或生产配置。

  design:
    - 使用简体中文编写。
    - 优先保留上游结构，通过导入前 capability gate 实现裁剪。
    - 说明关键技术决策、替代方案、取舍、风险及缓解措施。
    - 说明前后端能力定义、版本配对和插件兼容性如何保持一致。
    - 说明依赖裁剪、启动路径、后台任务及 Docker 产物的变化。
    - 涉及配置或数据库时必须给出备份、迁移和失败回退设计。
    - 说明如何验证资源目标以及如何避免增加空闲后台活动。

  tasks:
    - 使用简体中文编写，并按依赖顺序拆分为可独立验证的小任务。
    - 实现、测试、文档、提交和推送不得合并成一个笼统任务。
    - 明确列出后端、前端、插件兼容、Docker 和集成测试任务。
    - 每项实现任务必须附带对应测试或验证证据。
    - 涉及真实 115 令牌或外部服务的任务只能标记为 Canary 人工验证。
    - 在实施、提交、推送、发布和生产升级等边界保留用户批准检查点。
    - 未获得当前步骤批准时，不得提前执行后续任务。
