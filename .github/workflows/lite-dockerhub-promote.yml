name: MoviePilot Lite Docker Hub Promotion

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: Verified immutable Lite candidate tag, for example v2.14.5-lite.1-rc.8
        required: true
        type: string
      source_digest:
        description: Expected GHCR manifest digest, including the sha256 prefix
        required: true
        type: string
      target_tag:
        description: Docker Hub tag to promote; only latest is permitted
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: lite-dockerhub-promote-${{ inputs.target_tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified Lite candidate on Docker Hub
    runs-on: ubuntu-latest
    environment: lite-candidate
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate immutable promotion inputs
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.source_version }}
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-lite\.[0-9]+-rc\.[0-9]+$ ]]
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TARGET_TAG" = "latest" ]]

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote verified image without rebuilding
        id: promote
        shell: bash
        env:
          SOURCE_VERSION: ${{ inputs.source_version }}
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          TARGET_TAG: ${{ inputs.target_tag }}
          SOURCE_IMAGE: ghcr.io/zfl0087/moviepilot-lite
          TARGET_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/moviepilot-lite
        run: |
          set -euo pipefail

          source_ref="$SOURCE_IMAGE:$SOURCE_VERSION"
          target_ref="$TARGET_IMAGE:$TARGET_TAG"

          inspect_digest() {
            awk '$1 == "Digest:" { print $2; exit }'
          }

          source_output="$(docker buildx imagetools inspect "$source_ref")"
          source_digest="$(inspect_digest <<< "$source_output")"
          if [[ -z "$source_digest" || "$source_digest" != "$SOURCE_DIGEST" ]]; then
            echo "::error::Source digest mismatch: expected $SOURCE_DIGEST, got ${source_digest:-missing}"
            exit 1
          fi

          promotion_result="promoted"
          if target_output="$(docker buildx imagetools inspect "$target_ref" 2>/dev/null)"; then
            target_digest="$(inspect_digest <<< "$target_output")"
            if [[ "$target_digest" != "$SOURCE_DIGEST" ]]; then
              echo "::error::Target tag already exists with digest $target_digest"
              exit 1
            fi
            promotion_result="already_current"
          else
            docker buildx imagetools create --tag "$target_ref" "$source_ref@$SOURCE_DIGEST"
          fi

          target_output="$(docker buildx imagetools inspect "$target_ref")"
          target_digest="$(inspect_digest <<< "$target_output")"
          if [[ -z "$target_digest" || "$target_digest" != "$SOURCE_DIGEST" ]]; then
            echo "::error::Target digest mismatch: expected $SOURCE_DIGEST, got ${target_digest:-missing}"
            exit 1
          fi

          grep -Eq 'Platform:[[:space:]]+linux/amd64' <<< "$target_output"
          grep -Eq 'Platform:[[:space:]]+linux/arm64' <<< "$target_output"

          {
            echo "source_ref=$source_ref"
            echo "target_ref=$target_ref"
            echo "source_digest=$source_digest"
            echo "target_digest=$target_digest"
            echo "promotion_result=$promotion_result"
          } >> "$GITHUB_OUTPUT"

      - name: Write promotion report
        shell: bash
        env:
          SOURCE_REF: ${{ steps.promote.outputs.source_ref }}
          TARGET_REF: ${{ steps.promote.outputs.target_ref }}
          SOURCE_DIGEST: ${{ steps.promote.outputs.source_digest }}
          TARGET_DIGEST: ${{ steps.promote.outputs.target_digest }}
          PROMOTION_RESULT: ${{ steps.promote.outputs.promotion_result }}
        run: |
          set -euo pipefail
          cat > lite-dockerhub-promotion-report.txt <<EOF
          source_image=$SOURCE_REF
          target_image=$TARGET_REF
          source_digest=$SOURCE_DIGEST
          target_digest=$TARGET_DIGEST
          platforms=linux/amd64,linux/arm64
          promotion_result=$PROMOTION_RESULT
          EOF

      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: moviepilot-lite-latest-promotion
          path: lite-dockerhub-promotion-report.txt
          if-no-files-found: error
          retention-days: 14
